<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تحدّي الأبطال – المعرفة تصنع الفوز</title>
<!-- Tailwind CSS for modern utility styling -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<!-- Google Font: Cairo -->
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --blue: #1d4ed8;
    --orange: #ea580c;
    --green: #15803d;
    --background: #f1f5f9;
    --text: #0f172a;
  }
  * {
    box-sizing: border-box;
    font-family: 'Cairo', sans-serif;
  }
  body {
    margin: 0;
    background-color: var(--background);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  /* Animations */
  @keyframes pulseGlow {
    0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px rgba(29, 78, 216, 0.4)); }
    50% { transform: scale(1.03); filter: drop-shadow(0 0 16px rgba(234, 88, 12, 0.6)); }
  }
  .animate-pulse-glow {
    animation: pulseGlow 3s infinite ease-in-out;
  }
  
  @keyframes bounceIn {
    0% { transform: scale(0.8); opacity: 0; }
    70% { transform: scale(1.05); opacity: 1; }
    100% { transform: scale(1); }
  }
  .animate-bounce-in {
    animation: bounceIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .card-shadow {
    box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
  }

  .btn-hover {
    transition: all 0.2s ease-in-out;
  }
  .btn-hover:hover {
    transform: translateY(-2px);
  }
  .btn-hover:active {
    transform: translateY(0);
  }

  /* Timer Ring Progress */
  .timer-circle {
    transition: stroke-dashoffset 1s linear;
  }
</style>
</head>
<body class="bg-slate-100 min-h-screen flex flex-col justify-between">

  <!-- Header Section -->
  <header class="bg-gradient-to-r from-blue-700 via-indigo-700 to-purple-800 text-white shadow-xl py-6 px-4 text-center relative overflow-hidden">
    <div class="max-w-4xl mx-auto relative z-10">
      <h1 class="text-3xl md:text-5xl font-black tracking-wide flex items-center justify-center gap-3">
        <span>🏆</span> تحدّي الأبطال
      </h1>
      <p class="text-blue-100 mt-2 text-sm md:text-base font-semibold">المعرفة تصنع الفوز، والتعاون يصنع الأبطال</p>
    </div>
    <!-- Decorative background blobs -->
    <div class="absolute -top-10 -right-10 w-40 h-40 bg-white/10 rounded-full blur-2xl"></div>
    <div class="absolute -bottom-10 -left-10 w-40 h-40 bg-orange-500/20 rounded-full blur-2xl"></div>
  </header>

  <!-- Main Container -->
  <main class="max-w-4xl w-full mx-auto p-4 md:p-6 flex-grow">

    <!-- SETUP SECTION -->
    <section id="setup" class="bg-white card-shadow rounded-2xl p-6 md:p-8 mb-6 border border-slate-200 animate-bounce-in">
      <div class="flex items-center gap-3 mb-6 pb-4 border-b border-slate-100">
        <i class="fa-solid fa-sliders text-2xl text-blue-600"></i>
        <h2 class="text-2xl font-bold text-slate-800">إعداد المسابقة</h2>
      </div>

      <div class="space-y-4">
        <div>
          <label class="block font-bold text-slate-700 mb-2">عنوان المسابقة</label>
          <input id="gameTitle" type="text" value="تحدّي الأبطال المدرسي" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none transition">
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
            <label class="block font-bold text-blue-900 mb-2 flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-blue-600 inline-block"></span> الفريق الأول (A)
            </label>
            <input id="teamA" type="text" value="أبطال المعرفة" class="w-full p-3 border border-blue-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div class="bg-orange-50 p-4 rounded-xl border border-orange-200">
            <label class="block font-bold text-orange-900 mb-2 flex items-center gap-2">
              <span class="w-3 h-3 rounded-full bg-orange-500 inline-block"></span> الفريق الثاني (B)
            </label>
            <input id="teamB" type="text" value="عباقرة المستقبل" class="w-full p-3 border border-orange-300 rounded-lg focus:ring-2 focus:ring-orange-500 outline-none">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
          <div>
            <label class="block font-bold text-slate-700 mb-2">مدة الإجابة (بالثواني)</label>
            <input id="duration" type="number" value="30" min="10" max="120" class="w-full p-3 border border-slate-300 rounded-xl focus:ring-2 focus:ring-blue-500 outline-none">
          </div>
          <div>
            <label class="block font-bold text-slate-700 mb-2">نظام الصوت</label>
            <button id="toggleAudioBtn" onclick="toggleAudio()" class="w-full p-3 border border-slate-300 rounded-xl bg-slate-50 text-slate-700 font-bold flex items-center justify-center gap-2 hover:bg-slate-100">
              <i id="audioIcon" class="fa-solid fa-volume-high text-green-600"></i> <span id="audioText">المؤثرات الصوتية مُمكّنة</span>
            </button>
          </div>
        </div>

        <div class="pt-4 flex flex-col md:flex-row gap-3">
          <button onclick="startGame()" class="flex-1 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-black py-4 px-6 rounded-xl shadow-lg btn-hover text-lg flex items-center justify-center gap-2">
            <i class="fa-solid fa-play"></i> ابدأ المسابقة الآن
          </button>
        </div>
      </div>
    </section>

    <!-- GAMEPLAY SECTION -->
    <section id="game" class="hidden space-y-6">
      
      <!-- Scoreboard & Active Info Card -->
      <div class="bg-white card-shadow rounded-2xl p-6 border border-slate-200">
        <div class="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
          <h2 id="activeTitle" class="text-xl font-bold text-slate-700"></h2>
          <span id="roundBadge" class="px-3 py-1 bg-purple-100 text-purple-700 rounded-full text-xs font-black">الجولة 1</span>
        </div>

        <div class="grid grid-cols-2 gap-4 mb-4">
          <!-- Team A Card -->
          <div id="cardTeamA" class="bg-blue-50 border-2 border-blue-400 p-4 rounded-xl text-center transition-all">
            <div id="nameA" class="font-bold text-blue-900 text-lg truncate">--</div>
            <div class="text-4xl md:text-5xl font-black text-blue-700 my-1" id="scoreA">0</div>
            <div class="text-xs font-bold text-blue-600">نقطة</div>
          </div>

          <!-- Team B Card -->
          <div id="cardTeamB" class="bg-orange-50 border-2 border-orange-300 p-4 rounded-xl text-center transition-all opacity-60">
            <div id="nameB" class="font-bold text-orange-900 text-lg truncate">--</div>
            <div class="text-4xl md:text-5xl font-black text-orange-600 my-1" id="scoreB">0</div>
            <div class="text-xs font-bold text-orange-600">نقطة</div>
          </div>
        </div>

        <div class="flex flex-wrap justify-between items-center gap-2 text-sm bg-slate-50 p-3 rounded-xl border border-slate-200">
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-flag-checkered text-slate-500"></i>
            <span id="roundInfo" class="font-bold text-slate-700"></span>
          </div>
          <div class="flex items-center gap-2">
            <i class="fa-solid fa-user-gear text-blue-600"></i>
            <span id="turnInfo" class="font-black text-blue-800 text-base"></span>
          </div>
        </div>
      </div>

      <!-- Question & Options Card -->
      <div class="bg-white card-shadow rounded-2xl p-6 md:p-8 border border-slate-200 relative">
        
        <!-- Timer Widget -->
        <div class="flex justify-center mb-4">
          <div class="relative w-24 h-24 flex items-center justify-center">
            <svg class="w-full h-full transform -rotate-90">
              <circle cx="48" cy="48" r="40" stroke="#e2e8f0" stroke-width="8" fill="transparent" />
              <circle id="timerProgress" cx="48" cy="48" r="40" stroke="#ef4444" stroke-width="8" fill="transparent" 
                      stroke-dasharray="251.2" stroke-dashoffset="0" class="timer-circle" />
            </svg>
            <span id="timer" class="absolute text-2xl font-black text-slate-800">30</span>
          </div>
        </div>

        <div class="text-center mb-6">
          <span id="roundTitle" class="inline-block px-4 py-1 bg-amber-100 text-amber-800 rounded-full font-bold text-sm mb-3"></span>
          <div id="question" class="text-xl md:text-2xl font-black text-slate-800 leading-snug"></div>
          <div id="pointsBadge" class="mt-2 text-xs font-bold text-slate-400">القيمة: <span id="qPoints" class="text-slate-700">10</span> نقطة</div>
        </div>

        <!-- Answers Grid -->
        <div id="answers" class="grid grid-cols-1 md:grid-cols-2 gap-3 mb-6"></div>

        <!-- Lifelines/Bonus Section -->
        <div class="flex justify-center gap-3 mb-4">
          <button id="btnHint" onclick="useHint()" class="px-3 py-2 bg-purple-50 hover:bg-purple-100 border border-purple-200 text-purple-700 rounded-lg text-xs font-bold flex items-center gap-1">
            <i class="fa-solid fa-lightbulb"></i> تلميح (حذف خيارين)
          </button>
        </div>

        <!-- Feedback Container -->
        <div id="feedback" class="hidden p-4 rounded-xl border text-center font-bold text-base leading-relaxed mb-4"></div>

        <!-- Controls Container -->
        <div id="controls" class="flex flex-wrap justify-center gap-3 pt-4 border-t border-slate-100">
          <button id="pauseBtn" onclick="togglePauseGame()" class="bg-amber-500 hover:bg-amber-600 text-white font-bold py-2 px-5 rounded-xl btn-hover flex items-center gap-2">
            <i class="fa-solid fa-pause"></i> <span id="pauseBtnText">إيقاف مؤقت</span>
          </button>
          <button id="nextBtn" onclick="nextQuestion()" class="hidden bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-5 rounded-xl btn-hover flex items-center gap-2">
            <span>السؤال التالي</span> <i class="fa-solid fa-arrow-left"></i>
          </button>
          <button onclick="confirmEndGame()" class="bg-red-100 hover:bg-red-200 text-red-700 font-bold py-2 px-4 rounded-xl btn-hover text-sm flex items-center gap-1">
            <i class="fa-solid fa-power-off"></i> إنهاء
          </button>
        </div>

      </div>
    </section>

    <!-- RESULTS SECTION -->
    <section id="results" class="hidden bg-white card-shadow rounded-2xl p-6 md:p-10 border border-slate-200 text-center animate-bounce-in">
      <div class="w-20 h-20 bg-amber-100 rounded-full flex items-center justify-center mx-auto mb-4 text-amber-500 text-4xl shadow-inner">
        🏆
      </div>
      <h2 class="text-3xl font-black text-slate-800 mb-2">النتيجة النهائية</h2>
      <p class="text-slate-500 mb-6">تهانينا لجميع المشاركين في التحدي!</p>

      <div id="winner" class="text-2xl md:text-3xl font-black text-blue-700 mb-6 p-4 bg-gradient-to-r from-blue-50 to-indigo-50 rounded-2xl border border-blue-200"></div>

      <div class="grid grid-cols-2 gap-4 max-w-md mx-auto mb-8">
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
          <div id="resNameA" class="font-bold text-slate-700 truncate">الفريق A</div>
          <div id="resScoreA" class="text-3xl font-black text-blue-600">0</div>
          <div id="resStatsA" class="text-xs text-slate-500 mt-1">0 صح | 0 خطأ</div>
        </div>
        <div class="p-4 bg-slate-50 rounded-xl border border-slate-200">
          <div id="resNameB" class="font-bold text-slate-700 truncate">الفريق B</div>
          <div id="resScoreB" class="text-3xl font-black text-orange-600">0</div>
          <div id="resStatsB" class="text-xs text-slate-500 mt-1">0 صح | 0 خطأ</div>
        </div>
      </div>

      <div id="summary" class="text-slate-600 mb-8 max-w-lg mx-auto text-sm leading-relaxed"></div>

      <div class="flex flex-wrap justify-center gap-4">
        <button onclick="resetGame()" class="bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-6 rounded-xl shadow btn-hover flex items-center gap-2">
          <i class="fa-solid fa-rotate-right"></i> مباراة جديدة
        </button>
        <button onclick="window.print()" class="bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold py-3 px-6 rounded-xl btn-hover flex items-center gap-2">
          <i class="fa-solid fa-print"></i> طباعة النتائج
        </button>
      </div>
    </section>

  </main>

  <!-- Footer -->
  <footer class="text-center py-6 text-slate-500 text-sm border-t border-slate-200 bg-white">
    تحدّي الأبطال – منصة تفاعلية للمسابقات التعليمية
  </footer>

<script>
"use strict";

// --- AUDIO SYNTHESIZER ---
let audioEnabled = true;
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

function playTone(freq, duration, type = "sine") {
  if (!audioEnabled) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + duration);
  } catch (e) {}
}

function playSoundEffect(type) {
  if (!audioEnabled) return;
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  if (type === 'correct') {
    playTone(523.25, 0.15, 'triangle'); // C5
    setTimeout(() => playTone(659.25, 0.15, 'triangle'), 150); // E5
    setTimeout(() => playTone(783.99, 0.3, 'triangle'), 300); // G5
  } else if (type === 'wrong') {
    playTone(220, 0.2, 'sawtooth'); // A3
    setTimeout(() => playTone(185, 0.4, 'sawtooth'), 200); // F#3
  } else if (type === 'click') {
    playTone(400, 0.05, 'sine');
  } else if (type === 'timeout') {
    playTone(150, 0.5, 'square');
  }
}

function toggleAudio() {
  audioEnabled = !audioEnabled;
  const icon = document.getElementById('audioIcon');
  const text = document.getElementById('audioText');
  if (audioEnabled) {
    icon.className = "fa-solid fa-volume-high text-green-600";
    text.textContent = "المؤثرات الصوتية مُمكّنة";
  } else {
    icon.className = "fa-solid fa-volume-xmark text-red-500";
    text.textContent = "المؤثرات الصوتية معطلة";
  }
}

// --- GAME DATA & STATE ---
const roundsData = [
  {
    name: "الجولة الأولى: انطلاقة الأبطال",
    points: 10,
    questions: [
      { q: "ما ناتج 7 × 8؟", a: ["54", "56", "64", "48"], c: 1, e: "7 × 8 = 56." },
      { q: "ما الكوكب المعروف بالكوكب الأحمر؟", a: ["الزهرة", "المشتري", "المريخ", "عطارد"], c: 2, e: "المريخ هو الكوكب الأحمر بسبب غنى تربته بأكسيد الحديد." }
    ]
  },
  {
    name: "الجولة الثانية: لغز العباقرة",
    points: 20,
    questions: [
      { q: "شيء كلما أخذت منه كبر، فما هو؟", a: ["الحفرة", "الكتاب", "الظل", "القلم"], c: 0, e: "الحفرة اتساعها يزداد كلما أخذت منها." },
      { q: "ما العدد التالي في السلسلة: 2، 4، 8، 16، ...؟", a: ["18", "24", "30", "32"], c: 3, e: "كل عدد يساوي مضاعفة العدد الذي قبله (×2)." }
    ]
  },
  {
    name: "الجولة الثالثة: اربط واكتشف",
    points: 15,
    questions: [
      { q: "ما وحدة قياس المسافة والطول في النظام الدولي؟", a: ["اللتر", "المتر", "الكيلوغرام", "الثانية"], c: 1, e: "المتر هو وحدة قياس الأطوال الأساسية." },
      { q: "ما عاصمة المملكة العربية السعودية؟", a: ["جدة", "مكة المكرمة", "الرياض", "الدمام"], c: 2, e: "الرياض هي عاصمة المملكة العربية السعودية." }
    ]
  },
  {
    name: "الجولة الرابعة: صح أم خطأ؟",
    points: 10,
    questions: [
      { q: "الأرض تدور حول الشمس.", a: ["صحيح", "خطأ"], c: 0, e: "تدور الأرض حول الشمس دورة كاملة كل سنة." },
      { q: "الشمس كوكب من كواكب المجموعة الشمسية.", a: ["صحيح", "خطأ"], c: 1, e: "الشمس نجم وليست كوكبًا." }
    ]
  },
  {
    name: "الجولة الخامسة: صندوق المفاجآت",
    points: 25,
    questions: [
      { q: "ما أكبر محيط على سطح الأرض؟", a: ["المحيط الأطلسي", "المحيط الهندي", "المحيط الهادئ", "المحيط المتجمد الشمالي"], c: 2, e: "المحيط الهادئ هو المحيط الأكبر مساحة." }
    ]
  },
  {
    name: "الجولة السادسة: التحدي الذهبي",
    points: 50,
    questions: [
      { q: "ما مجموع زوايا المثلث الداخلية؟", a: ["90°", "180°", "270°", "360°"], c: 1, e: "مجموع زوايا أي مثلث هندسي مستوٍ يساوي دائماً 180 درجة." }
    ]
  }
];

let teams = [];
let questionsList = [];
let index = 0;
let turn = 0; // 0 for Team A, 1 for Team B
let timer = null;
let initialTime = 30;
let timeLeft = 30;
let locked = false;
let paused = false;
let correctCount = [0, 0];
let wrongCount = [0, 0];
let hintUsed = false;

// --- GAME LOGIC ---

function startGame() {
  const nameA = document.getElementById("teamA").value.trim() || "الفريق الأول";
  const nameB = document.getElementById("teamB").value.trim() || "الفريق الثاني";

  teams = [
    { name: nameA, score: 0 },
    { name: nameB, score: 0 }
  ];

  initialTime = Math.max(10, Math.min(120, Number(document.getElementById("duration").value) || 30));

  // Flatten questions from rounds
  questionsList = [];
  roundsData.forEach((round, rIndex) => {
    round.questions.forEach(q => {
      questionsList.push({
        ...q,
        roundIndex: rIndex,
        roundName: round.name,
        points: round.points
      });
    });
  });

  index = 0;
  turn = 0;
  correctCount = [0, 0];
  wrongCount = [0, 0];

  document.getElementById("setup").classList.add("hidden");
  document.getElementById("results").classList.add("hidden");
  document.getElementById("game").classList.remove("hidden");

  document.getElementById("activeTitle").textContent = document.getElementById("gameTitle").value || "تحدّي الأبطال";
  document.getElementById("nameA").textContent = teams[0].name;
  document.getElementById("nameB").textContent = teams[1].name;

  updateScoreboard();
  renderQuestion();
}

function updateScoreboard() {
  document.getElementById("scoreA").textContent = teams[0].score;
  document.getElementById("scoreB").textContent = teams[1].score;

  const cardA = document.getElementById("cardTeamA");
  const cardB = document.getElementById("cardTeamB");

  if (turn === 0) {
    cardA.classList.remove("opacity-60", "border-blue-400");
    cardA.classList.add("border-blue-600", "ring-4", "ring-blue-200", "scale-105");
    cardB.classList.add("opacity-60");
    cardB.classList.remove("border-orange-500", "ring-4", "ring-orange-200", "scale-105");
  } else {
    cardB.classList.remove("opacity-60", "border-orange-300");
    cardB.classList.add("border-orange-500", "ring-4", "ring-orange-200", "scale-105");
    cardA.classList.add("opacity-60");
    cardA.classList.remove("border-blue-600", "ring-4", "ring-blue-200", "scale-105");
  }

  document.getElementById("turnInfo").textContent = `دور: ${teams[turn].name}`;
}

function renderQuestion() {
  if (index >= questionsList.length) {
    endGame();
    return;
  }

  locked = false;
  hintUsed = false;
  document.getElementById("btnHint").disabled = false;
  document.getElementById("btnHint").classList.remove("opacity-50", "cursor-not-allowed");

  const currentQ = questionsList[index];
  
  document.getElementById("roundTitle").textContent = currentQ.roundName;
  document.getElementById("roundBadge").textContent = `الجولة ${currentQ.roundIndex + 1}`;
  document.getElementById("question").textContent = currentQ.q;
  document.getElementById("qPoints").textContent = currentQ.points;
  document.getElementById("roundInfo").textContent = `السؤال ${index + 1} من ${questionsList.length}`;

  const answersContainer = document.getElementById("answers");
  answersContainer.innerHTML = "";

  currentQ.a.forEach((optText, optIdx) => {
    const btn = document.createElement("button");
    btn.className = "w-full text-right p-4 rounded-xl border-2 border-slate-200 bg-slate-50 hover:bg-slate-100 hover:border-slate-300 font-bold text-slate-800 btn-hover transition flex items-center justify-between";
    btn.onclick = () => checkAnswer(optIdx, btn);
    btn.innerHTML = `<span>${optText}</span> <span class="w-7 h-7 rounded-full bg-slate-200 text-slate-600 flex items-center justify-center text-xs font-black">${optIdx + 1}</span>`;
    answersContainer.appendChild(btn);
  });

  const feedback = document.getElementById("feedback");
  feedback.className = "hidden p-4 rounded-xl border text-center font-bold text-base leading-relaxed mb-4";
  feedback.innerHTML = "";

  document.getElementById("nextBtn").classList.add("hidden");

  updateScoreboard();
  startTimer();
}

function startTimer() {
  clearInterval(timer);
  timeLeft = initialTime;
  updateTimerDisplay();

  timer = setInterval(() => {
    if (!paused) {
      timeLeft--;
      updateTimerDisplay();

      if (timeLeft <= 0) {
        clearInterval(timer);
        playSoundEffect('timeout');
        handleTimeout();
      }
    }
  }, 1000);
}

function updateTimerDisplay() {
  const timerText = document.getElementById("timer");
  timerText.textContent = timeLeft;

  // Circle SVG calculations
  const circle = document.getElementById("timerProgress");
  const totalDash = 251.2; // 2 * PI * r (r=40)
  const offset = totalDash - (timeLeft / initialTime) * totalDash;
  circle.style.strokeDashoffset = offset;

  if (timeLeft <= 5) {
    circle.setAttribute("stroke", "#ef4444"); // Red
    timerText.className = "absolute text-2xl font-black text-red-600 animate-pulse";
  } else {
    circle.setAttribute("stroke", "#3b82f6"); // Blue
    timerText.className = "absolute text-2xl font-black text-slate-800";
  }
}

function checkAnswer(selectedIdx, btnElement) {
  if (locked) return;
  locked = true;
  clearInterval(timer);

  const currentQ = questionsList[index];
  const isCorrect = selectedIdx === currentQ.c;
  const feedback = document.getElementById("feedback");

  const buttons = document.getElementById("answers").querySelectorAll("button");

  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === currentQ.c) {
      b.className = "w-full text-right p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-900 flex items-center justify-between shadow-sm";
    }
  });

  if (isCorrect) {
    playSoundEffect('correct');
    teams[turn].score += currentQ.points;
    correctCount[turn]++;
    btnElement.className = "w-full text-right p-4 rounded-xl border-2 border-emerald-500 bg-emerald-100 font-bold text-emerald-900 flex items-center justify-between shadow-md";
    
    feedback.classList.remove("hidden");
    feedback.classList.add("bg-emerald-50", "border-emerald-200", "text-emerald-800");
    feedback.innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 text-xl ml-2"></i> إجابة صحيحة! (+${currentQ.points} نقطة)<br><span class="text-sm font-normal text-emerald-700">${currentQ.e}</span>`;
  } else {
    playSoundEffect('wrong');
    wrongCount[turn]++;
    btnElement.className = "w-full text-right p-4 rounded-xl border-2 border-rose-500 bg-rose-100 font-bold text-rose-900 flex items-center justify-between shadow-md";

    feedback.classList.remove("hidden");
    feedback.classList.add("bg-rose-50", "border-rose-200", "text-rose-800");
    feedback.innerHTML = `<i class="fa-solid fa-circle-xmark text-rose-600 text-xl ml-2"></i> إجابة خاطئة!<br><span class="text-sm font-normal text-rose-700">${currentQ.e}</span>`;
  }

  updateScoreboard();
  document.getElementById("nextBtn").classList.remove("hidden");
}

function handleTimeout() {
  if (locked) return;
  locked = true;

  wrongCount[turn]++;
  const currentQ = questionsList[index];
  const feedback = document.getElementById("feedback");

  const buttons = document.getElementById("answers").querySelectorAll("button");
  buttons.forEach((b, i) => {
    b.disabled = true;
    if (i === currentQ.c) {
      b.className = "w-full text-right p-4 rounded-xl border-2 border-emerald-500 bg-emerald-50 font-bold text-emerald-900 flex items-center justify-between";
    }
  });

  feedback.classList.remove("hidden");
  feedback.classList.add("bg-amber-50", "border-amber-200", "text-amber-800");
  feedback.innerHTML = `<i class="fa-solid fa-clock text-amber-600 text-xl ml-2"></i> انتهى الوقت!<br><span class="text-sm font-normal text-amber-700">${currentQ.e}</span>`;

  document.getElementById("nextBtn").classList.remove("hidden");
}

function useHint() {
  if (locked || hintUsed) return;
  const currentQ = questionsList[index];

  // If options <= 2, hint not applicable
  if (currentQ.a.length <= 2) return;

  hintUsed = true;
  document.getElementById("btnHint").disabled = true;
  document.getElementById("btnHint").classList.add("opacity-50", "cursor-not-allowed");
  playSoundEffect('click');

  const buttons = Array.from(document.getElementById("answers").querySelectorAll("button"));
  let removed = 0;

  buttons.forEach((btn, idx) => {
    if (idx !== currentQ.c && removed < 2) {
      btn.style.visibility = "hidden";
      removed++;
    }
  });
}

function nextQuestion() {
  playSoundEffect('click');
  index++;
  // Switch turns
  turn = turn === 0 ? 1 : 0;
  renderQuestion();
}

function togglePauseGame() {
  paused = !paused;
  const btnText = document.getElementById("pauseBtnText");
  if (paused) {
    btnText.textContent = "استئناف";
  } else {
    btnText.textContent = "إيقاف مؤقت";
  }
}

function confirmEndGame() {
  if (confirm("هل أنت تأكد من إنهاء المسابقة الآن؟")) {
    endGame();
  }
}

function endGame() {
  clearInterval(timer);

  document.getElementById("game").classList.add("hidden");
  document.getElementById("results").classList.remove("hidden");

  const winnerElem = document.getElementById("winner");
  const summaryElem = document.getElementById("summary");

  document.getElementById("resNameA").textContent = teams[0].name;
  document.getElementById("resScoreA").textContent = teams[0].score;
  document.getElementById("resStatsA").textContent = `${correctCount[0]} صح | ${wrongCount[0]} خطأ`;

  document.getElementById("resNameB").textContent = teams[1].name;
  document.getElementById("resScoreB").textContent = teams[1].score;
  document.getElementById("resStatsB").textContent = `${correctCount[1]} صح | ${wrongCount[1]} خطأ`;

  if (teams[0].score > teams[1].score) {
    winnerElem.innerHTML = `🎉 الفائز هو: <span class="text-blue-600 font-black">${teams[0].name}</span>`;
  } else if (teams[1].score > teams[0].score) {
    winnerElem.innerHTML = `🎉 الفائز هو: <span class="text-orange-600 font-black">${teams[1].name}</span>`;
  } else {
    winnerElem.innerHTML = `🤝 تعادل رائع بين الفريقين!`;
  }

  summaryElem.textContent = `تم تقديم ${index} سؤالاً خلال هذه المسابقة. أظهر الفريقان أداءً متميزًا وتنافسًا شريفًا!`;
}

function resetGame() {
  document.getElementById("results").classList.add("hidden");
  document.getElementById("setup").classList.remove("hidden");
}
</script>
